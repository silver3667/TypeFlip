[project]
name = "hebrew-english-fix"
version = "0.1.0"
description = "Background daemons that fix Hebrew/English keyboard layout mistakes and typos on Windows and Linux"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["hebrew", "english", "keyboard", "layout", "typing", "hotkey", "daemon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "keyboard>=0.13.5",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Two folders ship a package literally named "layout_fix". With pytest's default
# import mode their modules collide in sys.modules when both test dirs are
# collected in one run. importlib mode isolates them.
addopts = "--import-mode=importlib"
# typing-assistant tests need OPENAI_API_KEY and a different rootdir;
# run them explicitly via `pytest typing-assistant/tests/` instead.
testpaths = ["tests", "layout-fix-daemon/tests"]
